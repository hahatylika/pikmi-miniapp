<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PIKMI SPCLUB</title>
  <style>
    :root { --wine:#55232d; --wine-dark:#37151d; --olive:#7b8152; --cream:#f8f0df; --sand:#ead9bd; --ink:#352e25; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#ddd3c2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .app { max-width:430px; min-height:100vh; margin:auto; padding:calc(22px + env(safe-area-inset-top)) 20px calc(92px + env(safe-area-inset-bottom)); background:var(--cream); overflow:hidden; }
    header { display:flex; justify-content:space-between; align-items:center; } .brand { font-size:21px; font-weight:900; letter-spacing:1.2px; color:var(--wine); } .brand span { color:var(--olive); }
    .avatar { width:38px; height:38px; border-radius:50%; color:white; background:var(--olive); display:grid; place-items:center; font-weight:800; border:3px solid #e5d5b6; }
    .hello { margin:30px 0 20px; } .eyebrow { color:var(--olive); font-size:12px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; } h1 { margin:7px 0 0; font-family:Georgia,serif; color:var(--wine); font-size:31px; line-height:1.05; }
    .hero { position:relative; overflow:hidden; padding:23px; border-radius:25px; min-height:197px; color:white; background:linear-gradient(140deg,var(--wine),var(--wine-dark)); box-shadow:0 12px 30px #55232d33; }
    .hero:after { content:"✦"; position:absolute; right:-7px; bottom:-42px; color:#d5bd8b; font-size:176px; opacity:.25; transform:rotate(18deg); } .hero p { margin:5px 0 16px; color:#f5e9d4; font-size:14px; max-width:225px; line-height:1.35; }
    .progress { position:relative; z-index:1; width:100%; height:8px; background:#ffffff35; border-radius:10px; overflow:hidden; } .progress i { display:block; width:65%; height:100%; border-radius:inherit; background:#d4ba82; }
    .row { display:flex; justify-content:space-between; align-items:center; margin:27px 0 13px; } h2 { font-size:18px; color:var(--wine); margin:0; } button, .link { border:0; background:none; color:var(--olive); font-size:13px; font-weight:800; cursor:pointer; }
    .workout { display:grid; grid-template-columns:72px 1fr; gap:15px; align-items:center; padding:13px; border-radius:19px; background:#fffaf0; box-shadow:0 5px 18px #4e381310; } .thumb { height:70px; display:grid; place-items:center; border-radius:14px; background:var(--sand); color:var(--wine); font-size:29px; } .workout h3 { margin:0 0 5px; font-size:16px; } .workout p { margin:0; font-size:13px; color:#796c59; }
    .chips { display:flex; gap:9px; overflow:auto; padding:2px 0; scrollbar-width:none; } .chip { flex:0 0 auto; padding:12px 14px; border:1px solid #e7d8bd; border-radius:16px; background:#fffaf0; text-align:center; font-size:12px; font-weight:700; } .chip b { display:block; color:var(--wine); font-size:16px; }
    nav { position:fixed; z-index:2; bottom:0; left:50%; transform:translateX(-50%); max-width:430px; width:100%; height:76px; padding:10px 27px calc(10px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; background:#fffaf0ee; border-top:1px solid #eadfc9; backdrop-filter:blur(12px); } .nav { color:#a69783; text-align:center; font-size:10px; } .nav i { display:block; font-style:normal; font-size:21px; margin-bottom:3px; } .nav.active { color:var(--wine); font-weight:800; }
    .toast { position:fixed; left:50%; bottom:91px; transform:translate(-50%,20px); opacity:0; transition:.25s; background:var(--ink); color:white; padding:11px 15px; border-radius:14px; font-size:13px; white-space:nowrap; } .toast.show { transform:translate(-50%,0); opacity:1; }
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand">PIK<span>MI</span> <small style="font-size:10px;letter-spacing:1px">SPCLUB</small></div><div class="avatar">П</div></header>
    <section class="hello"><div class="eyebrow">Твой ритм сегодня</div><h1>Привет, Полина ✦</h1></section>
    <section class="hero"><div class="eyebrow" style="color:#d4ba82">Ноябрьская миссия</div><h2 style="color:white;font:24px Georgia,serif;margin:8px 0 0">Двигайся<br>в своём темпе</h2><p>Ещё 2 тренировки — и новая награда твоя.</p><div class="progress"><i></i></div><small style="display:block;margin-top:7px;color:#f5e9d4">3 из 5 тренировок</small></section>
    <div class="row"><h2>Тренировка дня</h2><button onclick="notify('Все тренировки уже здесь')">Все</button></div>
    <article class="workout"><div class="thumb">↗</div><div><h3>Мягкая сила</h3><p>25 минут · всё тело</p><button style="margin-top:8px;padding:0" onclick="notify('Тренировка «Мягкая сила» выбрана')">Начать →</button></div></article>
    <div class="row"><h2>Твой календарь</h2><button onclick="notify('Ноябрь 2026')">Ноябрь</button></div>
    <div class="chips"><div class="chip"><b>Пн</b>2</div><div class="chip"><b>Вт</b>3</div><div class="chip" style="background:var(--olive);color:white;border-color:var(--olive)"><b style="color:white">Ср</b>4</div><div class="chip"><b>Чт</b>5</div><div class="chip"><b>Пт</b>6</div></div>
  </main>
  <nav><div class="nav active"><i>⌂</i>Главная</div><div class="nav" onclick="notify('Раздел тренировок')"><i>◌</i>Тренировки</div><div class="nav" onclick="notify('Твои награды')"><i>✦</i>Награды</div><div class="nav" onclick="notify('Профиль')"><i>◉</i>Профиль</div></nav><div class="toast" id="toast"></div>
  <script>function notify(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}</script>
</body>
</html>
